name: ci
on: { push: {}, pull_request: {}, schedule: [{ cron: "32 6 * * 1" }], workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { repository: fhionnghaile/veritas, path: veritas }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: "8.3", extensions: sodium }
      - name: Model checks + trace validation against the real verifier
        run: REQUIRE_TRACE=1 VERITAS_SRC=veritas/src bash run-checks.sh
